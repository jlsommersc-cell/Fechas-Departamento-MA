<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva Departamento Marbella</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel para procesar JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const FAMILIA = [
      { id: 'ogro', nombre: 'Ogro (Papá)', rol: 'papa', icono: '👑' },
      { id: 'juano', nombre: 'Juano', rol: 'hijo', icono: '🏄‍♂️' },
      { id: 'benja', nombre: 'Benja', rol: 'hijo', icono: '🎾' },
      { id: 'santi', nombre: 'Santi', rol: 'hijo', icono: '⚽' }
    ];

    const DORMITORIOS = [
      { id: 1, nombre: 'Dormitorio 1 (Principal)', desc: 'Asignado a Ogro (Papá)', principal: true },
      { id: 2, nombre: 'Dormitorio 2', desc: 'Dormitorio secundario', principal: false },
      { id: 3, nombre: 'Dormitorio 3', desc: 'Dormitorio secundario', principal: false },
      { id: 4, nombre: 'Dormitorio 4 (Afuera / Bodega)', desc: 'Cuarto exterior para capacidad completa', principal: false }
    ];

    function App() {
      const [reservas, setReservas] = useState(() => {
        const saved = localStorage.getItem('marbella_reservas');
        return saved ? JSON.parse(saved) : [];
      });

      const [usuario, setUsuario] = useState('ogro');
      const [dormitorioSel, setDormitorioSel] = useState(1);
      const [fechaInicio, setFechaInicio] = useState('2026-11-13');
      const [fechaFin, setFechaFin] = useState('2026-11-15');

      useEffect(() => {
        localStorage.setItem('marbella_reservas', JSON.stringify(reservas));
      }, [reservas]);

      const handleReserva = (e) => {
        e.preventDefault();
        if (usuario !== 'ogro' && dormitorioSel === 1) {
          alert('El Dormitorio 1 (Principal) está reservado exclusivamente para Ogro (Papá).');
          return;
        }

        const nueva = {
          id: Date.now(),
          usuario,
          dormitorio: dormitorioSel,
          fechaInicio,
          fechaFin
        };

        setReservas([...reservas, nueva]);
        alert('¡Reserva registrada con éxito!');
      };

      const eliminarReserva = (id) => {
        if (confirm('¿Deseas cancelar esta reserva?')) {
          setReservas(reservas.filter(r => r.id !== id));
        }
      };

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
          <header className="bg-blue-900 text-white p-6 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
              <h1 className="text-2xl font-bold">🏢 Departamento Marbella</h1>
              <p className="text-blue-200 text-sm">Gestión de Reservas Familiares (13 Nov 2026 - 13 Nov 2027)</p>
            </div>
            <div className="bg-blue-800 px-4 py-2 rounded-xl text-xs text-blue-100 border border-blue-700">
              Período Activo
            </div>
          </header>

          <div className="grid md:grid-cols-3 gap-6">
            <div className="md:col-col-span-1 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
              <h2 className="font-bold text-lg text-slate-900 border-b pb-2">Nueva Reserva</h2>
              <form onSubmit={handleReserva} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">¿Quién reserva?</label>
                  <select 
                    value={usuario} 
                    onChange={(e) => setUsuario(e.target.value)}
                    className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                  >
                    {FAMILIA.map(f => (
                      <option key={f.id} value={f.id}>{f.icono} {f.nombre}</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Dormitorio</label>
                  <select 
                    value={dormitorioSel} 
                    onChange={(e) => setDormitorioSel(Number(e.target.value))}
                    className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                  >
                    {DORMITORIOS.map(d => (
                      <option key={d.id} value={d.id} disabled={usuario !== 'ogro' && d.principal}>
                        {d.nombre} {d.principal ? '🔒' : ''}
                      </option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Desde</label>
                  <input 
                    type="date" 
                    min="2026-11-13" 
                    max="2027-11-13" 
                    value={fechaInicio} 
                    onChange={(e) => setFechaInicio(e.target.value)}
                    className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Hasta</label>
                  <input 
                    type="date" 
                    min={fechaInicio} 
                    max="2027-11-13" 
                    value={fechaFin} 
                    onChange={(e) => setFechaFin(e.target.value)}
                    className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm"
                  />
                </div>

                <button 
                  type="submit" 
                  className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition duration-200"
                >
                  Confirmar Reserva
                </button>
              </form>
            </div>

            <div className="md:col-span-2 space-y-6">
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 className="font-bold text-lg text-slate-900 border-b pb-2 mb-4">Próximas Reservas</h2>
                {reservas.length === 0 ? (
                  <p className="text-sm text-slate-500 text-center py-8">No hay reservas registradas aún.</p>
                ) : (
                  <div className="space-y-3">
                    {reservas.map(r => {
                      const u = FAMILIA.find(f => f.id === r.usuario);
                      const d = DORMITORIOS.find(item => item.id === r.dormitorio);
                      return (
                        <div key={r.id} className="p-4 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center">
                          <div>
                            <div className="font-semibold text-slate-800 text-sm">{u?.icono} {u?.nombre}</div>
                            <div className="text-xs text-slate-500">{d?.nombre}</div>
                            <div className="text-xs text-blue-600 font-medium mt-1">📅 {r.fechaInicio} ➔ {r.fechaFin}</div>
                          </div>
                          <button 
                            onClick={() => eliminarReserva(r.id)} 
                            className="text-xs text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg transition"
                          >
                            Cancelar
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
